<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Codex Deck</title>
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#090c12" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22512%22%20height%3D%22512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%230b0f16%22/%3E%3Crect%20x%3D%2296%22%20y%3D%22150%22%20width%3D%22140%22%20height%3D%2290%22%20rx%3D%2220%22%20fill%3D%22%232187fa%22/%3E%3Crect%20x%3D%22276%22%20y%3D%22150%22%20width%3D%22140%22%20height%3D%2290%22%20rx%3D%2220%22%20fill%3D%22%232ed470%22/%3E%3Crect%20x%3D%2296%22%20y%3D%22272%22%20width%3D%22140%22%20height%3D%2290%22%20rx%3D%2220%22%20fill%3D%22%23ffa021%22/%3E%3Crect%20x%3D%22276%22%20y%3D%22272%22%20width%3D%22140%22%20height%3D%2290%22%20rx%3D%2220%22%20fill%3D%22%232d3542%22/%3E%3C/svg%3E" />
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22Codex%20Deck%22%2C%20%22short_name%22%3A%20%22Codex%20Deck%22%2C%20%22display%22%3A%20%22fullscreen%22%2C%20%22orientation%22%3A%20%22landscape%22%2C%20%22background_color%22%3A%20%22%23090c12%22%2C%20%22theme_color%22%3A%20%22%23090c12%22%2C%20%22start_url%22%3A%20%22.%22%2C%20%22scope%22%3A%20%22.%22%2C%20%22icons%22%3A%20%5B%7B%22src%22%3A%20%22data%3Aimage/svg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A//www.w3.org/2000/svg%2522%2520width%253D%2522512%2522%2520height%253D%2522512%2522%253E%253Crect%2520width%253D%2522512%2522%2520height%253D%2522512%2522%2520rx%253D%2522112%2522%2520fill%253D%2522%25230b0f16%2522/%253E%253Crect%2520x%253D%252296%2522%2520y%253D%2522150%2522%2520width%253D%2522140%2522%2520height%253D%252290%2522%2520rx%253D%252220%2522%2520fill%253D%2522%25232187fa%2522/%253E%253Crect%2520x%253D%2522276%2522%2520y%253D%2522150%2522%2520width%253D%2522140%2522%2520height%253D%252290%2522%2520rx%253D%252220%2522%2520fill%253D%2522%25232ed470%2522/%253E%253Crect%2520x%253D%252296%2522%2520y%253D%2522272%2522%2520width%253D%2522140%2522%2520height%253D%252290%2522%2520rx%253D%252220%2522%2520fill%253D%2522%2523ffa021%2522/%253E%253Crect%2520x%253D%2522276%2522%2520y%253D%2522272%2522%2520width%253D%2522140%2522%2520height%253D%252290%2522%2520rx%253D%252220%2522%2520fill%253D%2522%25232d3542%2522/%253E%253C/svg%253E%22%2C%20%22sizes%22%3A%20%22any%22%2C%20%22type%22%3A%20%22image/svg%2Bxml%22%2C%20%22purpose%22%3A%20%22any%20maskable%22%7D%5D%7D" />
<style>
  :root {
    --canvas: #090c12; --panel: #161a22; --key: #232a35; --key-hi: #2d3542;
    --ink: #eef1f6; --dim: #8b95a5; --blue: #2187fa; --orange: #ffa021;
    --green: #2ed470; --red: #ff4556; --mint: #43e3c2; --purple: #7a6cf2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: radial-gradient(1200px 700px at 50% -10%, #101724, var(--canvas));
    color: var(--ink); font: 15px/1.45 -apple-system, "PingFang SC", "Noto Sans SC", Roboto, sans-serif;
    min-height: 100vh; padding: 18px 16px 40px; user-select: none;
  }
  .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  @media (orientation: landscape) and (min-width: 900px) {
    html, body { height: 100%; overflow: hidden; }
    body { padding: 12px 18px; }
    .wrap { max-width: none; height: 100%; display: grid; column-gap: 18px; row-gap: 12px;
      grid-template-columns: 1.7fr 1fr; grid-template-rows: auto 1fr auto;
      grid-template-areas: "head head" "deck chips" "deck usage"; align-items: stretch; }
    header { grid-area: head; }
    /* Left column: keyboard fills the whole height, keys grow with it. */
    .deck { grid-area: deck; height: 100%; }
    .agents { flex: 1; min-height: 0; }
    .key { aspect-ratio: auto; height: 100%; }
    .key .title { font-size: clamp(15px, 2.4vh, 22px); -webkit-line-clamp: 2; }
    .actions { min-height: 68px; }
    .micbar { min-height: 72px; }
    /* Right column: switch chips scroll above, capacity pinned at the bottom. */
    #chips { grid-area: chips; align-content: start; overflow-y: auto; min-height: 0; }
    .usage { grid-area: usage; }
    .chip { max-width: 100%; }
  }
  header { display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 19px; letter-spacing: 3px; margin: 0; font-weight: 800; }
  header .sub { color: var(--dim); font-size: 11px; letter-spacing: 2px; }
  #fs { margin-left: auto; background: none; border: 1px solid #ffffff20; color: var(--dim);
    width: 34px; height: 34px; border-radius: 9px; font-size: 16px; cursor: pointer; }
  #conn { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); }
  #conn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  #conn.ok .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }

  .deck { background: linear-gradient(150deg, #141a24, #0b0f16); border: 1px solid #ffffff1f;
    border-radius: 26px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 18px 50px #0009; }

  .agents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key { position: relative; border-radius: 18px; background: linear-gradient(180deg, var(--key-hi), var(--key));
    border: 1px solid #ffffff24; aspect-ratio: 1.35 / 1; padding: 12px; cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 6px 14px #0007, inset 0 1px 0 #ffffff2e; transition: transform .09s; }
  .key:active { transform: translateY(2px); }
  .key .status { width: 9px; height: 9px; border-radius: 50%; background: #5a6270; }
  .key .glow { position: absolute; inset: 0; margin: auto; width: 34%; height: 34%; border-radius: 50%;
    background: var(--purple); filter: blur(16px); opacity: .28; pointer-events: none; }
  .key .title { font-size: 15px; font-weight: 600; color: #cfd6e2; text-align: center;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .key .ctx { font-size: 9.5px; color: var(--dim); text-align: right; }
  .key.selected { border-color: var(--mint); box-shadow: 0 0 14px #43e3c266, inset 0 1px 0 #ffffff2e; }
  .key[data-tone="working"]  { --tone: var(--blue); }
  .key[data-tone="approval"] { --tone: var(--orange); }
  .key[data-tone="done"]     { --tone: var(--green); }
  .key[data-tone="error"]    { --tone: var(--red); }
  .key[data-tone] .status { background: var(--tone); box-shadow: 0 0 8px var(--tone); }
  .key[data-tone] .glow { background: var(--tone); opacity: .55; }
  .key[data-tone] { background: linear-gradient(180deg, color-mix(in srgb, var(--tone) 16%, var(--key-hi)), var(--key)); }
  .chase { position: absolute; inset: -2px; border-radius: 18px; padding: 2.5px; pointer-events: none;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; overflow: hidden; }
  .chase::before { content: ""; position: absolute; inset: -60%;
    background: conic-gradient(transparent 0 58%, var(--tone, var(--blue)) 82%, #fff 96%, transparent 100%);
    animation: spin 1.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .micbar { width: 100%; border: 1px solid #ffffff24; border-radius: 18px; min-height: 84px;
    background: linear-gradient(180deg, var(--key-hi), var(--key)); color: var(--ink);
    font: 700 17px/1.3 inherit; cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 10px; box-shadow: 0 6px 14px #0007, inset 0 1px 0 #ffffff2e; transition: transform .09s; }
  .micbar:active { transform: translateY(2px); }
  .micbar.listening { border-color: var(--red); color: #fff;
    background: linear-gradient(180deg, #5a1b24, #2b0e13); animation: breathe .9s ease-in-out infinite alternate; }
  .micbar .icon { font-size: 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 12px; padding: 10px 14px; font-size: 13.5px; font-weight: 600; color: #c6cdd9;
    background: linear-gradient(180deg, var(--key-hi), var(--key)); border: 1px solid #ffffff1e;
    cursor: pointer; box-shadow: 0 3px 8px #0006; max-width: 46%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; transition: transform .09s; }
  .chip:active { transform: translateY(1px); }
  .chip.selected { border-color: var(--mint); color: var(--mint); }
  .chip .pin { color: var(--orange); margin-right: 4px; }
  #menu { max-width: 460px; width: 92vw; padding: 24px; border: 1px solid #ffffff26;
    background: linear-gradient(160deg, #1a2130, #10141d); border-radius: 24px;
    box-shadow: 0 24px 60px #000b; }
  #menu .mtitle { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 18px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu button { display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; margin-top: 12px; min-height: 60px; border-radius: 16px; font: 700 16px/1 inherit;
    color: var(--ink); border: 1px solid #ffffff24; cursor: pointer;
    background: linear-gradient(180deg, var(--key-hi), var(--key));
    box-shadow: 0 6px 14px #0007, inset 0 1px 0 #ffffff2e; transition: transform .09s; }
  #menu button:active { transform: translateY(2px); }
  #menu .danger { background: linear-gradient(180deg, #5a1b24, #2b0e13); color: #ff9aa5; border-color: #ff45564d; }
  #menu #menuCancel { background: none; box-shadow: none; border-color: transparent; color: var(--dim); min-height: 46px; }
  .act { border-radius: 16px; min-height: 72px; font-size: 24px; color: var(--ink);
    background: linear-gradient(180deg, var(--key-hi), var(--key)); border: 1px solid #ffffff24;
    box-shadow: 0 5px 12px #0007, inset 0 1px 0 #ffffff2e; cursor: pointer; transition: transform .09s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .act small { font-size: 9.5px; color: var(--dim); letter-spacing: 1px; }
  .act:active { transform: translateY(2px); }
  .act.listening { border-color: var(--red); box-shadow: 0 0 16px #ff455688; animation: breathe 0.9s ease-in-out infinite alternate; }
  @keyframes breathe { from { box-shadow: 0 0 6px #ff455644; } to { box-shadow: 0 0 18px #ff4556aa; } }


  .usage { display: flex; gap: 16px; align-items: center; background: var(--panel);
    border: 1px solid #ffffff18; border-radius: 18px; padding: 13px 16px; }
  .usage .bars { flex: 1; display: flex; flex-direction: column; gap: 9px; }
  .bar .lbl { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim);
    letter-spacing: 1px; margin-bottom: 4px; }
  .bar .lbl b { color: var(--ink); }
  .bar .track { height: 7px; border-radius: 99px; background: #ffffff14; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 99px; background: var(--green); width: 0%; transition: width .4s; }

  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #20293a; border: 1px solid #ffffff22; color: var(--ink); font-size: 13px;
    padding: 10px 18px; border-radius: 99px; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 90vw; box-shadow: 0 8px 30px #000a; }
  #toast.show { opacity: 1; }
  #toast.err { background: #47141c; border-color: #ff455677; }

  dialog { background: var(--panel); color: var(--ink); border: 1px solid #ffffff22;
    border-radius: 18px; padding: 22px; max-width: 340px; width: 90vw; }
  dialog::backdrop { background: #000a; }
  dialog input { width: 100%; margin: 12px 0; padding: 11px; border-radius: 10px;
    border: 1px solid #ffffff26; background: #0d1119; color: var(--ink); font: inherit; user-select: text; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CODEX</h1><span class="sub">DECK · WEB</span>
    <button id="fs" title="全屏">⛶</button>
    <div id="conn"><span class="dot"></span><span id="connText">连接中…</span></div>
  </header>

  <div class="deck">
    <div class="agents" id="agents"></div>
    <div class="actions">
      <button class="act" data-act="ACT06" title="Fast">⚡<small>FAST</small></button>
      <button class="act" data-act="ACT07" title="Approve">✓<small>批准</small></button>
      <button class="act" data-act="ACT08" title="Reject">✕<small>拒绝</small></button>
      <button class="act" data-act="ACT09" title="Fork">⑂<small>分叉</small></button>
    </div>
    <button class="micbar" id="macMic">
      <span class="icon">🎙</span><span id="micText">按一下,对着 Mac 说话</span>
    </button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="usage">
    <div class="bars">
      <div class="bar"><div class="lbl"><span>5 HOUR <span id="r5"></span></span><b id="p5">—</b></div>
        <div class="track"><div class="fill" id="f5"></div></div></div>
      <div class="bar"><div class="lbl"><span>WEEKLY <span id="rw"></span></span><b id="pw">—</b></div>
        <div class="track"><div class="fill" id="fw"></div></div></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<dialog id="menu">
  <div class="mtitle" id="menuTitle"></div>
  <button class="btn" id="menuPin"></button>
  <button class="btn danger" id="menuArchive">归档</button>
  <button class="btn" id="menuCancel">取消</button>
</dialog>
<dialog id="tokenDialog">
  <b>输入配对令牌</b>
  <div style="color:var(--dim);font-size:12px;margin-top:6px">Mac 上 relay-config 打印的 token(只需输入一次)</div>
  <input id="tokenInput" placeholder="token" autocomplete="off" />
  <button class="btn send" id="tokenSave" style="width:100%">连接</button>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const norm = (v) => v ? v.replace(/^[a-z]+:/i, "") : v;
  let ws = null, snapshot = null, hostName = "", reqId = 0, macListening = false, gotReady = false;
  const pending = new Map();

  // ---- token ----
  const params = new URLSearchParams(location.search);
  if (params.get("token")) {
    localStorage.setItem("codex-deck-token", params.get("token"));
    history.replaceState(null, "", location.pathname);
  }
  const token = () => localStorage.getItem("codex-deck-token") || "";

  function askToken() {
    $("tokenInput").value = token();
    $("tokenDialog").showModal();
    $("tokenSave").onclick = () => {
      const v = $("tokenInput").value.trim();
      if (!v) return;
      localStorage.setItem("codex-deck-token", v);
      $("tokenDialog").close();
      connect();
    };
  }

  // ---- websocket ----
  function connect() {
    if (!token()) return askToken();
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}`);
    setConn(false, "连接中…");
    gotReady = false;
    ws.onopen = () => ws.send(JSON.stringify({ type: "auth", protocol: 1, token: token() }));
    ws.onmessage = (e) => handle(JSON.parse(e.data));
    ws.onclose = () => {
      if (!gotReady) {
        // Closed before authentication succeeded — almost always a bad token.
        setConn(false, "令牌无效,请重新输入");
        askToken();
        return;
      }
      setConn(false, "已断开,重连中…");
      setTimeout(connect, 2500);
    };
    ws.onerror = () => {};
  }

  function handle(m) {
    if (m.type === "ready") { gotReady = true; hostName = m.host?.hostName ?? ""; setConn(true, hostName); }
    if (m.type === "snapshot") { snapshot = m.snapshot; render(); }
    if (m.type === "result") {
      const p = pending.get(m.requestId); pending.delete(m.requestId);
      if (!m.ok) toast(m.error || "命令失败", true);
      else if (p) toast(p);
    }
  }

  function send(command, note) {
    if (!ws || ws.readyState !== 1) return toast("未连接", true);
    const requestId = "web-" + (++reqId);
    if (note) pending.set(requestId, note);
    ws.send(JSON.stringify({ type: "command", protocol: 1, requestId, command }));
  }

  function setConn(ok, text) {
    $("conn").classList.toggle("ok", ok);
    $("connText").textContent = text;
  }

  // ---- render ----
  const tone = (s) =>
    ["working", "thinking"].includes(s) ? "working" :
    ["approval", "awaiting-approval", "awaiting-response"].includes(s) ? "approval" :
    ["unread", "complete", "completed", "done"].includes(s) ? "done" :
    s === "error" ? "error" : null;


  // ---- long-press → thread menu (pin / archive) ----
  let menuTarget = null, pressTimer = null, longPressed = false;
  function attachLongPress(el, target) {
    const startPress = () => {
      longPressed = false;
      pressTimer = setTimeout(() => { longPressed = true; openMenu(target); }, 550);
    };
    const cancelPress = () => clearTimeout(pressTimer);
    el.addEventListener("pointerdown", startPress);
    el.addEventListener("pointerup", cancelPress);
    el.addEventListener("pointerleave", cancelPress);
    el.addEventListener("contextmenu", (e) => e.preventDefault());
  }
  function openMenu(target) {
    menuTarget = target;
    $("menuTitle").textContent = target.title || "未命名会话";
    $("menuPin").textContent = target.pinned ? "取消置顶(移出六键区)" : "置顶(放入六键区)";
    $("menuArchive").textContent = "归档";
    $("menu").showModal();
  }
  $("menuPin").onclick = () => {
    send({ kind: "thread", op: "toggle-pin", slot: menuTarget.slot, threadKey: menuTarget.threadKey },
      menuTarget.pinned ? "已取消置顶" : "已置顶");
    $("menu").close();
  };
  $("menuArchive").onclick = () => {
    if ($("menuArchive").textContent !== "确认归档?") { $("menuArchive").textContent = "确认归档?"; return; }
    send({ kind: "thread", op: "archive", slot: menuTarget.slot, threadKey: menuTarget.threadKey }, "已归档");
    $("menu").close();
  };
  $("menuCancel").onclick = () => $("menu").close();

  function makeCard({ title, threadKey, status, selected, ctx, agentSlot, pinned }) {
    const key = document.createElement("div");
    key.className = "key" + (selected ? " selected" : "");
    const t = status ? tone(status) : null;
    if (t) key.dataset.tone = t;
    key.innerHTML = `
      ${t === "working" ? '<div class="chase"></div>' : ""}
      <div class="status"></div><div class="glow"></div>
      <div class="title">${title ? esc(title) : "<span style='color:#4a5260'>＋</span>"}</div>
      <div class="ctx">${ctx != null ? Math.round(ctx) + "%" : ""}</div>`;
    if (threadKey) {
      key.onclick = () => {
        if (longPressed) { longPressed = false; return; }
        send({ kind: "agent", slot: agentSlot, threadKey, act: 1 });
        setTimeout(() => send({ kind: "agent", slot: agentSlot, threadKey, act: 0 }, "已切换到 " + (title ?? "会话")), 90);
      };
      attachLongPress(key, { slot: agentSlot, threadKey, title, pinned: !!pinned });
    }
    return key;
  }

  function render() {
    const box = $("agents"); box.innerHTML = "";
    const pinnedByKey = new Map((snapshot.sidebarThreads ?? [])
      .filter((t) => t.threadKey).map((t) => [norm(t.threadKey), !!t.pinned]));
    const used = new Set();
    for (const slot of snapshot.slots) {
      if (slot.threadKey) used.add(norm(slot.threadKey));
      box.appendChild(makeCard({
        title: slot.title, threadKey: slot.threadKey, status: slot.status,
        selected: slot.selected, ctx: slot.contextUsedPercent, agentSlot: slot.id,
        pinned: slot.threadKey ? pinnedByKey.get(norm(slot.threadKey)) ?? false : false,
      }));
    }
    // Every other sidebar thread becomes a small switch-only chip.
    const chips = $("chips"); chips.innerHTML = "";
    for (const t of (snapshot.sidebarThreads ?? [])) {
      if (!t.threadKey || used.has(norm(t.threadKey))) continue;
      const chip = document.createElement("div");
      const isActive = norm(t.threadKey) === norm(snapshot.activeThreadKey);
      chip.className = "chip" + (isActive ? " selected" : "");
      chip.innerHTML = (t.pinned ? '<span class="pin">📌</span>' : "") + esc(t.title || "未命名会话");
      chip.onclick = () => {
        if (longPressed) { longPressed = false; return; }
        send({ kind: "agent", slot: 5, threadKey: t.threadKey, act: 1 });
        setTimeout(() => send({ kind: "agent", slot: 5, threadKey: t.threadKey, act: 0 }, "已切换到 " + (t.title || "会话")), 90);
      };
      attachLongPress(chip, { slot: 5, threadKey: t.threadKey, title: t.title, pinned: !!t.pinned });
      chips.appendChild(chip);
    }

    const usage = snapshot.usage;
    const w5 = usage?.windows?.find((w) => w.kind === "five-hour");
    const ww = usage?.windows?.find((w) => w.kind === "weekly");
    setBar("5", w5); setBar("w", ww);
  }

  function setBar(which, w) {
    $("p" + which).textContent = w ? Math.round(w.remainingPercent) + "%" : "—";
    $("f" + which).style.width = (w ? Math.max(0, Math.min(100, w.remainingPercent)) : 0) + "%";
    $("f" + which).style.background = !w ? "" : w.remainingPercent < 20 ? "var(--red)" : w.remainingPercent < 40 ? "var(--orange)" : "var(--green)";
    $("r" + which).textContent = w?.resetsAt ? "↻ " + fmtReset(w.resetsAt) : "";
  }

  function fmtReset(ms) {
    const d = new Date(ms);
    if (d - Date.now() < 0) return "";
    const hm = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    return d - Date.now() < 86400e3 ? hm : `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
  }

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---- actions ----
  for (const btn of document.querySelectorAll(".act[data-act]")) {
    btn.onclick = () => {
      const slot = btn.dataset.act;
      send({ kind: "action", slot, act: 1 });
      setTimeout(() => send({ kind: "action", slot, act: 0 }, btn.title), 90);
    };
  }
  $("macMic").onclick = () => {
    macListening = !macListening;
    $("macMic").classList.toggle("listening", macListening);
    $("macMic").querySelector(".icon").textContent = macListening ? "🔴" : "🎙";
    $("micText").textContent = macListening ? "正在听……说完再按一下,自动发送" : "按一下,对着 Mac 说话";
    send({ kind: "keycap", keycapId: "MIC" }, macListening ? "Mac 正在听" : "已停止,发送中");
  };

  // ---- toast ----
  let toastTimer;
  function toast(msg, err) {
    const t = $("toast");
    t.textContent = msg; t.className = "show" + (err ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (t.className = ""), 2600);
  }

  // Tap the connection indicator to re-enter the token at any time.
  $("conn").onclick = () => askToken();

  $("fs").onclick = async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
        try { await screen.orientation.lock("landscape"); } catch {}
      } else {
        await document.exitFullscreen();
      }
    } catch {}
  };

  connect();
})();
</script>
</body>
</html>
